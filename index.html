    <div class="lb" id="lb" aria-hidden="true">
        <button type="button" class="close-btn" aria-label="Fermer">×</button>
        <iframe></iframe>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const items = document.querySelectorAll('.item');

        const prev = document.getElementById('prev');
        const next = document.getElementById('next');

        const lb = document.getElementById('lb');
        const frame = lb.querySelector('iframe');
        const closeBtn = lb.querySelector('.close-btn');

        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');

        let currentIndex = 0;

        function updateGallery() {
            items.forEach(item => {
                item.classList.remove('active');
            });

            items[currentIndex].classList.add('active');

            const itemWidth = items[currentIndex].offsetWidth;
            const gap = 32;

            const centerPosition = window.innerWidth / 2;

            const itemPosition =
                currentIndex * (itemWidth + gap) +
                itemWidth / 2;

            const offset = centerPosition - itemPosition;

            gallery.style.transform = `translateX(${offset}px)`;
        }

        next.addEventListener('click', () => {
            currentIndex++;

            if (currentIndex >= items.length) {
                currentIndex = 0;
            }

            updateGallery();
        });

        prev.addEventListener('click', () => {
            currentIndex--;

            if (currentIndex < 0) {
                currentIndex = items.length - 1;
            }

            updateGallery();
        });

        items.forEach(item => {
            item.addEventListener('click', e => {
                e.preventDefault();

                frame.src = item.href;

                lb.classList.add('open');
                lb.setAttribute('aria-hidden', 'false');
            });
        });

        function closeLightbox() {
            frame.src = 'about:blank';

            lb.classList.remove('open');
            lb.setAttribute('aria-hidden', 'true');
        }

        closeBtn.addEventListener('click', closeLightbox);

        lb.addEventListener('click', e => {
            if (e.target === lb) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const target = tab.dataset.tab;

                tabs.forEach(button => {
                    button.classList.remove('active');
                });

                tabContents.forEach(content => {
                    content.classList.remove('active');
                });

                tab.classList.add('active');
                document.getElementById(target).classList.add('active');

                updateGallery();
            });
        });

        window.addEventListener('resize', updateGallery);

        updateGallery();
    </script>
